services:
  postgres:
    image: postgres:16-alpine
    container_name: eibo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eibo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eibo_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eibo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data_pipeline/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eibo_user} -d ${POSTGRES_DB:-eibo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eibo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-eibo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eibo_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-eibo_db}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eibo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eibo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eibo.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  postgres_data:
