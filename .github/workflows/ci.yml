name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs for the same branch / PR on a new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new ruff release can't turn CI red without a code change.
      # Keep in sync with requirements-dev.txt.
      - name: Install ruff
        run: pip install "ruff==0.9.10"

      # --output-format=github emits inline annotations on the PR diff
      - name: Ruff check
        run: ruff check . --output-format=github

  # ── Python tests ────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Full suite: unit + integration + security + performance.
      # None of them need external services (they run on generated demo data).
      # Coverage floor comes from [tool.coverage.report] fail_under in pyproject.toml.
      - name: Run tests
        env:
          DEMO_MODE_ENABLED: "true"
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: pytest tests/ -p no:cacheprovider

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"          # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  # ── Security scans ──────────────────────────────────────────────────────────
  security:
    name: Security (bandit + dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scanners
        run: pip install "bandit>=1.7.9" "pip-audit>=2.7"

      # Fails on medium+ severity findings in application code
      - name: Bandit (SAST)
        run: bandit -r . -x ./tests,./frontend,./sdk,./htmlcov -ll

      - name: pip-audit (Python CVEs)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: npm audit (frontend CVEs)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ── Docker images ───────────────────────────────────────────────────────────
  # Builds both images (no push) so a broken Dockerfile is caught before deploy.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
